name: Sentinel Coolify Docker Build

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript typecheck
        run: npm run check
      - name: Build frontend and production Express server
        run: npm run build
      - name: Verify deployable production artifacts
        run: |
          test -s dist/index.html
          test -s dist/server.cjs
          test -s Dockerfile
      - name: Build Coolify Docker image
        run: docker build --pull -t sentinel-ci:${{ github.sha }} .
