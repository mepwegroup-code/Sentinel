name: sentinel-os

services:
  sentinel:
    image: sentinel-os:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      SENTINEL_DATA_DIR: /app/data
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - sentinel_data:/app/data
    init: true
    restart: "no"
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

volumes:
  sentinel_data:
